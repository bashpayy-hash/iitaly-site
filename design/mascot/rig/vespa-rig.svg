<svg xmlns="http://www.w3.org/2000/svg" id="vespa" viewBox="0 -46 240 234" role="img" aria-label="Веспа — маскот IITALY, анимированная модель">
  <g id="road" opacity="0">
    <line x1="8" y1="170" x2="232" y2="170" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="18 14" opacity=".35"/>
  </g>

  <g id="speedlines" opacity="0" stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <line x1="6" y1="62" x2="40" y2="62"/>
    <line x1="0" y1="92" x2="30" y2="92"/>
    <line x1="10" y1="122" x2="46" y2="122"/>
  </g>

  <g id="exhaust" opacity="0" fill="currentColor">
    <circle id="puff-1" cx="26" cy="126" r="5" opacity=".18"/>
    <circle id="puff-2" cx="14" cy="118" r="7" opacity=".12"/>
    <circle id="puff-3" cx="2"  cy="110" r="9" opacity=".08"/>
  </g>

  <ellipse id="shadow" cx="118" cy="164" rx="96" ry="8" fill="currentColor" opacity=".12"/>

  <g id="chassis">
    <g id="wheel-rear">
      <circle cx="64" cy="132" r="23" fill="#211a14"/>
      <circle cx="64" cy="132" r="7.5" fill="#fffdf8"/>
      <g id="spokes-rear" stroke="#fffdf8" stroke-width="2.4" stroke-linecap="round" opacity=".5">
        <line x1="64" y1="112" x2="64" y2="152"/>
        <line x1="47" y1="122" x2="81" y2="142"/>
        <line x1="47" y1="142" x2="81" y2="122"/>
      </g>
    </g>
    <g id="wheel-front">
      <circle cx="176" cy="134" r="19" fill="#211a14"/>
      <circle cx="176" cy="134" r="6.5" fill="#fffdf8"/>
      <g id="spokes-front" stroke="#fffdf8" stroke-width="2.2" stroke-linecap="round" opacity=".5">
        <line x1="176" y1="118" x2="176" y2="150"/>
        <line x1="162" y1="126" x2="190" y2="142"/>
        <line x1="162" y1="142" x2="190" y2="126"/>
      </g>
    </g>

    <g id="torso">
      <path id="body" d="M40,120 C34,104 42,88 58,80 C70,74 86,72 100,76 C110,79 114,86 112,96 L112,112 C112,120 108,126 98,130 C82,136 58,136 46,130 C42,128 41,124 40,120 Z"
            fill="#b4262b" stroke="#211a14" stroke-width="4" stroke-linejoin="round"/>
      <path id="seat" d="M108,110 L160,108 L160,120 C160,124 156,127 150,127 L114,128 C110,128 108,124 108,120 Z"
            fill="#8f1d21" stroke="#211a14" stroke-width="4" stroke-linejoin="round"/>
      <path id="shield" d="M156,108 C150,90 150,70 158,54 C163,44 175,40 184,46 C193,52 196,68 194,84 C192,100 186,112 176,116 C168,119 160,116 156,108 Z"
            fill="#b4262b" stroke="#211a14" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <g id="handlebar">
      <path d="M178,44 C176,36 172,30 165,26" stroke="#211a14" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M165,26 C158,23 150,23 144,27" stroke="#211a14" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <circle id="mirror" cx="144" cy="27" r="5.5" fill="#fffdf8" stroke="#211a14" stroke-width="3"/>
    </g>

    <!-- Лента-настро: два штриха одной геометрии (тёмный кант и
         кремовая сердцевина) плюс наконечник. Это «рука» персонажа —
         единственная часть, которой он может помахать. -->
    <g id="ribbon">
      <path class="ribbon-line" d="M139,28 C122,26 104,32 88,26 C76,22 66,26 56,20"
            stroke="#211a14" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <path class="ribbon-line" d="M139,28 C122,26 104,32 88,26 C76,22 66,26 56,20"
            stroke="#fffdf8" stroke-width="3.6" fill="none" stroke-linecap="round"/>
      <circle id="ribbon-tip" cx="54" cy="19" r="3.4" fill="#b25000" stroke="#211a14" stroke-width="1.6"/>
    </g>

    <!-- Лицо: фара — глаз, дуга под ней — рот. Обе дуги рта заданы
         одной командой Q с одинаковым числом точек, поэтому между
         ними возможен настоящий морфинг, а не подмена. -->
    <g id="face">
      <circle id="lamp" cx="174" cy="68" r="13" fill="#fffdf8" stroke="#211a14" stroke-width="3.5"/>
      <path id="mouth" d="M165,65 Q174,59 183,65" stroke="#211a14" stroke-width="2.8"
            fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>

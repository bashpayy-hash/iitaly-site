name: University review source
on:
  push:
    branches: [feat/university-visual-consistency]
    paths: [.github/workflows/university-review-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          mkdir -p /tmp/university-review-source
          git archive HEAD | gzip > /tmp/university-review-source/source.tar.gz
          git rev-parse HEAD > /tmp/university-review-source/source-sha.txt
          npm ci
          if [ -d node_modules/next/dist/docs ]; then
            tar -czf /tmp/university-review-source/next-docs.tar.gz -C node_modules/next/dist docs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: university-review-source
          path: /tmp/university-review-source/
          retention-days: 3

# Одноразовый: переносит восемь страниц Modulo 1 со стороннего CDN в проект.
# Из рабочей среды разработчика этот хост недоступен, у раннера GitHub — да.
# Каждый файл сверяется с sha256 из permessoOriginalGeometry.ts; при
# расхождении шаг падает и ничего не коммитится. Файл удаляется следующим
# коммитом, как только страницы оказались в ветке.
name: Vendor Modulo 1 pages (one-off)

on:
  push:
    branches: [claude/improve-website-design-ylr1p1]
    paths: [.github/workflows/vendor-permesso-pages.yml]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/improve-website-design-ylr1p1

      - name: Скачать и сверить страницы
        run: |
          set -euo pipefail
          cdn="https://d2ol7oe51mr4n9.cloudfront.net/user_3IEOyz95hPdwK9Yu4IfSlkWBSlJ"
          mkdir -p public/permesso
          while read -r page name sha bytes; do
            out="public/permesso/modulo1-page-${page}.webp"
            curl -fsSL --retry 3 "${cdn}/${name}" -o "${out}"
            echo "${sha}  ${out}" | sha256sum -c -
            test "$(stat -c%s "${out}")" -eq "${bytes}"
          done <<'PAGES'
          1 0a9ea39b-6d11-49a1-9f44-1d8ac459a4d8.webp f609784102d429bb79c2e747f56119dc6e69c2f506eca27394d57148640d86bd 90386
          2 6197ee86-f592-42aa-b2f4-880ba25fa2d6.webp a82548859c5f466b448165012d57b15277b8d316f9ce0890763b04068213355d 79908
          3 651d4291-4411-47e0-a06c-c5660305144b.webp e1c7c928c00d0b80bdb4ef073f790927f6c077ae3309232ea978c1fbab5f608c 82922
          4 f70f382a-e77a-4261-b0b4-c48ebc9a7498.webp 0c8cf0eee1ab556a9989f76b6879e61f88b8bbe42e90b10962ee5519c3e31c79 65758
          5 6ef1ed32-a4a6-46c6-b9b8-6ede05a3dccf.webp aa9cf13a4ebec64c01c796ff02158c210147d69a2e34d1671f50ec85891f4abb 67152
          6 d03ebc7a-608c-4b75-bc81-a6b7a00c54bf.webp 03de277fcf481b40ce1554cdb7ed58e085bafd41c03eb8b428731fd51af2eb8b 66704
          7 54eaf595-6863-424f-8556-f2e4c52d4048.webp db6bbff34424554ff31330086fd6a443407bb26d12d190d0b58ad1bce4ea3ead 64236
          8 bef86551-3367-4929-a598-0b108fdca545.webp 7d38a02204d682c7fdb8197c0f58543b9a156906154224e973e2e3b09b735484 64668
          PAGES

      - name: Закоммитить в ветку
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/permesso
          git commit -m "Modulo 1: восемь страниц бланка в проекте, сверены по sha256"
          git push origin HEAD:claude/improve-website-design-ylr1p1

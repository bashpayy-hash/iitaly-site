name: Import selected accents
on:
  push:
    branches: [feat/illustrated-university-comparison]
    paths: [.github/workflows/import-selected-accents.yml]
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/illustrated-university-comparison
      - run: python -m pip install Pillow==11.3.0
      - name: Import only the approved attachments
        run: |
          python - <<'PY'
          import hashlib, io, json, urllib.request
          from pathlib import Path
          from PIL import Image
          assets = [
            ('lemon-postcard', 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IEOyz95hPdwK9Yu4IfSlkWBSlJ/2eae30fe-d652-40ac-b309-8665dfa23fb2.png', 'eeef23586e55e8b10b0bdb5f2ddc94d76d11a3abf5de06853156d5247f42545a'),
            ('travel-paperwork', 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IEOyz95hPdwK9Yu4IfSlkWBSlJ/46f1394e-b64f-4829-bbd6-e066fd472fd1.png', 'b0efeffcc8ab215232c02cbecd8579d295cb25f643897c36e9c07e9da5b78f50'),
            ('tomato-bowl', 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IEOyz95hPdwK9Yu4IfSlkWBSlJ/a16b4eee-58bb-469e-bfdf-e66fb8c78176.png', '5e1a1d9188642b2607d5418da081d800009e15ded47a462ff55c6dd417c52292'),
          ]
          root = Path('public/illustrations/editorial')
          root.mkdir(parents=True, exist_ok=True)
          manifest = {}
          for name, url, expected in assets:
            data = urllib.request.urlopen(url, timeout=40).read()
            assert hashlib.sha256(data).hexdigest() == expected
            image = Image.open(io.BytesIO(data)).convert('RGBA')
            assert image.getchannel('A').getextrema() == (0, 255)
            variants = []
            for width in (640, 320):
              height = round(image.height * width / image.width)
              resized = image.resize((width, height), Image.Resampling.LANCZOS)
              path = root / f'{name}-{width}.webp'
              resized.save(path, 'WEBP', quality=85, method=6, exact=True)
              variants.append({'src': '/' + str(path.relative_to('public')), 'width': width, 'height': height, 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
            manifest[name] = {'source': url, 'sourceSha256': expected, 'origin': 'User-approved image_gen attachment, transferred via Higgsfield; not regenerated', 'variants': variants}
          Path('docs/selected-accents-assets.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit local assets on the work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/illustrations/editorial/*-640.webp public/illustrations/editorial/*-320.webp docs/selected-accents-assets.json
          git diff --cached --quiet || git commit -m 'assets: store selected watercolor accents as local responsive WebP'
          git push origin HEAD:feat/illustrated-university-comparison
          git archive --format=tar.gz -o /tmp/iitaly-current-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iitaly-current-source
          path: |
            /tmp/iitaly-current-source.tar.gz
            /tmp/source-sha.txt
          retention-days: 3

name: Import approved pricing landscape
on:
  push:
    branches: [feat/prices-coastal-landscape]
    paths: [.github/workflows/prices-art-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prices-coastal-landscape
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read installed image documentation
        run: |
          mkdir -p /tmp/prices-review-docs
          find node_modules/next/dist/docs -type f -iname '*image*' -exec cp {} /tmp/prices-review-docs/ \;
      - name: Import only the approved attachment
        run: |
          python -m pip install --quiet Pillow==11.3.0
          curl --fail --silent --show-error --location --max-time 45 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IEOyz95hPdwK9Yu4IfSlkWBSlJ/53117481-8bc2-40b2-92f4-41384bc2484d.png' -o /tmp/coastal-terrace.png
          echo '023c232b561e78c3087d9b13d53d899cc954dbec7f39ce6128eca51022aa6b6c  /tmp/coastal-terrace.png' | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib,json
          image=Image.open('/tmp/coastal-terrace.png')
          assert image.size==(1448,1086) and image.mode=='RGBA'
          assert image.getchannel('A').getextrema()==(0,255)
          assets=[]
          for width in (360,720):
              path=Path(f'public/illustrations/editorial/coastal-terrace-{width}.webp')
              assert not path.exists()
              image.resize((width,width*3//4),Image.Resampling.LANCZOS).save(path,'WEBP',quality=84,method=6)
              assets.append({'path':str(path),'width':width,'height':width*3//4,'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          Path('docs/prices-landscape-asset.json').write_text(json.dumps({'source':'User-approved coastal terrace attachment from this conversation; not a new generation','sourceSha256':'023c232b561e78c3087d9b13d53d899cc954dbec7f39ce6128eca51022aa6b6c','treatment':'Only resized and encoded to WebP; original alpha and full composition retained','assets':assets},indent=2)+'\n')
          PY
          git rm .github/workflows/prices-art-import.yml
          git add public/illustrations/editorial/coastal-terrace-360.webp public/illustrations/editorial/coastal-terrace-720.webp docs/prices-landscape-asset.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: store approved coastal terrace as local transparent WebP'
          git push origin HEAD:refs/heads/feat/prices-coastal-landscape
          git archive --format=tar.gz --output=/tmp/prices-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/prices-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prices-source
          path: |
            /tmp/prices-source.tar.gz
            /tmp/prices-source-sha.txt
            /tmp/prices-review-docs/
          retention-days: 3

name: Design review

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/marketing/**"
      - "src/components/home/**"
      - "src/components/journey/**"
      - "src/components/universities/**"
      - "src/app/universities/**"
      - "src/components/PaperOverlayGate.tsx"
      - "src/components/apple/**"
      - "src/components/guides/**"
      - "src/components/plan/**"
      - "src/lib/usePlanDraft.ts"
      - "src/lib/localWorkspace.ts"
      - "src/components/portal/**"
      - "src/app/portal/**"
      - "src/lib/checkDocument.ts"
      - "src/components/Header.tsx"
      - "src/components/Footer.tsx"
      - "src/components/portal/PortalExplorer.tsx"
      - "src/components/portal/HelpSection.tsx"
      - "src/components/portal/PortalLogin.tsx"
      - "src/components/portal/portal-login.module.css"
      - "src/components/prices/**"
      - "src/components/payment/**"
      - "src/components/chat/**"
      - "src/components/mascot/**"
      - "src/components/brand/**"
      - "src/app/icon.svg"
      - "src/app/apple-icon.png"
      - "src/components/Modal.tsx"
      - "src/lib/lead.ts"
      - "src/lib/phone.ts"
      - "src/lib/chat.ts"
      - "src/lib/payment.ts"
      - "scripts/launch-*.mjs"
      - "public/illustrations/editorial/**"
      - "public/permesso/**"
      - "docs/editorial-art-assets.json"
      - "docs/selected-accents-assets.json"
      - "src/components/motion/HeadingPin.tsx"
      - "src/app/page.tsx"
      - "src/app/plan/**"
      - "src/app/prices/**"
      - "src/app/guides/**"
      - "scripts/design-*.mjs"
      - ".github/workflows/design-review.yml"

permissions:
  contents: read

concurrency:
  group: design-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Owner, 19 Nov: «Почему слияние занимает так много времени» — the 40
  # reviews ran one after another in one job (~25 min, 6 of them installing
  # the browser). They now run in four parallel groups balanced by their
  # durations on a hosted runner (~4-5 min of reviews each), and the
  # browser download is cached. The same reviews, the same order inside a
  # group; a group runs every review it holds and fails if any failed.
  review:
    name: review (${{ matrix.group }})
    # Playwright 1.56.1 cannot install Chromium on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: guides
            reviews: >-
              design-permesso-transfer-review design-brand-review admissions-browser-review
              design-guides-vespi-review design-guides-access-review launch-document-review
          - group: portal
            reviews: >-
              design-portal-focus-review design-portal-route-action-review design-media-switcher-review
              design-vespi-system-review launch-chat-review launch-flow-review design-portal-progress-review
          - group: journey
            reviews: >-
              design-portal-pages-review portal-targeted-model-review design-portal-targeted-review
              design-portal-document-clarity-review design-ux-review design-warm-palette-review
              design-vespi-handmade-review design-portal-login-review design-review design-accents-review
          - group: workspace
            reviews: >-
              design-workspace-review design-flight-explorers-review design-vespi-unique-review
              design-portal-university-selection-review design-portal-contained-flow-review
              design-portal-document-report-review design-permesso-hover-review design-permesso-editor-review
              design-comparison-review design-university-review design-prices-landscape-review
              design-reminders-review
    env:
      NEXT_PUBLIC_BACKEND_URL: https://example.invalid
      NEXT_PUBLIC_STRIPE_ENABLED: "true"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REVIEW_TOOLS: /tmp/iitaly-browser/node_modules
      BASELINE_OUT: /tmp/iitaly-base/out
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Protect the map and product contracts
        run: node scripts/design-guard.mjs "$BASE_SHA"
      - run: npm ci
      - run: npm run build
      - name: Build the exact base for visual comparison
        run: |
          mkdir -p /tmp/iitaly-base
          git archive "$BASE_SHA" | tar -x -C /tmp/iitaly-base
          cp -al node_modules /tmp/iitaly-base/node_modules
          cd /tmp/iitaly-base
          npm run build
      - name: Restore isolated browser tools
        uses: actions/cache@v4
        with:
          path: |
            /tmp/iitaly-browser
            ~/.cache/ms-playwright
          key: browser-tools-ubuntu-24.04-playwright-1.56.1-pngjs-7.0.0-axe-4.10.3
      - name: Restore the font packages the runner image lacks
        uses: actions/cache@v4
        with:
          path: /tmp/iitaly-apt-debs
          key: chromium-system-debs-ubuntu-24.04-playwright-1.56.1-v1
      # The system libraries and fonts stay exactly the set Playwright asks
      # for (`install-deps --dry-run`). The runner image lacks seven font
      # packages, and its Ubuntu mirror served them at ~66 kB/s (21 MB in
      # 5 min, 19 Nov). Their .deb files are cached once and installed with
      # dpkg; apt runs only for what is still missing after that, and it
      # refills the cache. Skipping the packages instead changed how the
      # cabinet behaved (portal focus review).
      - name: Install isolated browser tools (no lockfile changes)
        run: |
          PW=/tmp/iitaly-browser/node_modules/.bin/playwright
          if [ ! -x "$PW" ]; then
            npm install --prefix /tmp/iitaly-browser --no-package-lock --ignore-scripts playwright@1.56.1 pngjs@7.0.0 axe-core@4.10.3
          fi
          "$PW" install chromium
          wanted=$("$PW" install-deps --dry-run chromium | sed -n 's/.*--no-install-recommends \([^"]*\)".*/\1/p')
          test -n "$wanted"
          lacking() {
            missing=""
            for pkg in $wanted; do
              dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q "install ok installed" || missing="$missing $pkg"
            done
          }
          lacking
          if [ -n "$missing" ] && ls /tmp/iitaly-apt-debs/*.deb > /dev/null 2>&1; then
            echo "Installing cached packages for:$missing"
            sudo dpkg -i /tmp/iitaly-apt-debs/*.deb || echo "Cached packages did not install cleanly; apt takes over"
            lacking
          fi
          if [ -n "$missing" ]; then
            echo "Installing missing system packages with apt:$missing"
            printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99iitaly-timeouts > /dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends --download-only $missing
            mkdir -p /tmp/iitaly-apt-debs
            cp /var/cache/apt/archives/*.deb /tmp/iitaly-apt-debs/
            sudo apt-get install -y -f --no-install-recommends $missing
          else
            echo "All system packages for Chromium are installed"
          fi
      - name: Run the ${{ matrix.group }} reviews
        run: |
          failed=""
          for review in ${{ matrix.reviews }}; do
            echo "::group::$review"
            start=$(date +%s)
            if node "scripts/$review.mjs"; then status=passed; else status=FAILED; failed="$failed $review"; fi
            echo "::endgroup::"
            echo "$review: $status in $(( $(date +%s) - start ))s"
          done
          if [ -n "$failed" ]; then echo "::error::Failed reviews:$failed"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iitaly-design-review-${{ matrix.group }}
          path: design-review/
          if-no-files-found: ignore

  # One status under the old name, green only when every group is green.
  visual-review:
    if: ${{ always() }}
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every review group passed
        run: test "${{ needs.review.result }}" = success

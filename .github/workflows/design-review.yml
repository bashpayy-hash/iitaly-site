name: Design review

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "design/**"
      - "scripts/**"
      - "package*.json"
      - "DESIGN.md"
      - ".github/workflows/design-review.yml"

permissions:
  contents: read
concurrency:
  group: design-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BACKEND_URL: https://example.invalid
      NEXT_PUBLIC_STRIPE_ENABLED: "true"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REVIEW_TOOLS: /tmp/iitaly-browser/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Protect catalogue, payment, API and printed form contracts
        run: node scripts/design-guard.mjs "$BASE_SHA"
      - run: npm ci
      - name: Enforce the eight gallery colors without shadows or gradients
        run: npm run check:palette
      - run: npm run build
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/iitaly-browser --no-package-lock --ignore-scripts playwright@1.56.1 pngjs@7.0.0 axe-core@4.10.3
          /tmp/iitaly-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Review all public and workspace surfaces on desktop and mobile
        run: node scripts/gallery-review.mjs
      - name: Review guided reading, history, keyboard, assistant context and gallery motion
        run: node scripts/gallery-interactions.mjs
      - name: Review admissions questionnaire and annual visa calculator
        run: node scripts/admissions-browser-review.mjs
      - name: Review shared draft, shortlist, comparison and document completion boundaries
        run: node scripts/design-workspace-review.mjs
      - name: Review document retry, long filenames and modal focus
        run: node scripts/launch-document-review.mjs
      - name: Review chat retry, timeout, contact recovery and free access
        run: node scripts/launch-chat-review.mjs
      - name: Review checkout timeout and authenticated portal failure recovery
        run: node scripts/launch-flow-review.mjs
      - name: Review printed form transfer and date boundaries
        run: node scripts/design-permesso-transfer-review.mjs
      - name: Review exact form geometry, keyboard entry and local draft
        run: node scripts/design-permesso-editor-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iitaly-gallery-review
          path: design-review/
          retention-days: 7

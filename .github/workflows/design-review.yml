name: Design review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: design-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Archive the exact review source
        run: git archive --format=tar.gz --output=/tmp/iitaly-review-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: iitaly-review-source
          path: /tmp/iitaly-review-source.tar.gz
          retention-days: 3

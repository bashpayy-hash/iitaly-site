name: Import approved artwork
on:
  push:
    branches: [feat/subtle-italian-accents]
    paths: [.github/workflows/import-approved-art.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'bashpayy-hash/iitaly-site' && github.ref == 'refs/heads/feat/subtle-italian-accents'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Copy only the approved images, verify originals, produce WebP
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import sharp from 'sharp';
          const root = 'public/illustrations/editorial';
          await mkdir(root, {recursive:true});
          const sha = b => createHash('sha256').update(b).digest('hex');
          const sources = [
            ['terrace','728faf20-6d49-4a23-893c-12906ec75ed2','8506a7c08372b1a7723fd0fc6a8ce0c1026dae012a92af9e7c602422fb4b7631',1200],
            ['balcony-scene','b0636626-9d26-4eef-a4f0-23f0a8b074a8','9d380a85fa02015fa4203b6fcb94dd0f5bf3ff3dceb9903cdefc3492d8dfa35b',1000],
            ['study-desk','455adc7c-ea79-4ac9-b6f3-91a73aa11ae0','cf0e0634a1b6436015b961b42ca3739dabe9491d066433a1fa34c9bd6c462637',900],
            ['tomatoes','74bd39b8-31a1-48b5-99ce-0cf82c0f71cc','0bfb5bba05a79402976f6186f3ce31e21792eabd5050a969abeaac3d74cff52a',440]
          ];
          const manifest = {};
          for (const [name,id,hash,width] of sources) {
            const url = `https://d2ol7oe51mr4n9.cloudfront.net/user_3IEOyz95hPdwK9Yu4IfSlkWBSlJ/${id}.png`;
            const res = await fetch(url, {signal:AbortSignal.timeout(60000)});
            assert.equal(res.status,200,name);
            const bytes = Buffer.from(await res.arrayBuffer());
            assert.equal(sha(bytes),hash,`${name}: exact approved source`);
            const sizes = name === 'tomatoes' ? [width] : [480,width];
            const variants = [];
            for (const w of sizes) {
              const filename = `${name}${w === width ? '' : '-480'}.webp`;
              const {data,info} = await sharp(bytes).resize({width:w,withoutEnlargement:true}).webp({quality:83,effort:6,alphaQuality:100}).toBuffer({resolveWithObject:true});
              await writeFile(`${root}/${filename}`,data);
              variants.push({file:filename,width:info.width,height:info.height,bytes:data.length,sha256:sha(data)});
            }
            manifest[name] = {origin:'approved conversation image_gen output; transferred with Higgsfield',sourceSha256:hash,variants};
          }
          const accents = JSON.parse(await readFile('src/components/marketing/italian-accents.json','utf8'));
          const hashes = {lemon:'bfb1e865e4d4b155b89133ff3718dae5b697fb772a15e901b6272fb96db34051',moka:'31df55b0e3732d50b116f8f811b53083f8175cca523885fa5d731aaaf1aaca53',balcony:'31650bf798803d94fcb0ed557bf6d22759c370f467fa3f954fc1c474bf1a75aa'};
          for (const [name,asset] of Object.entries(accents)) {
            const res = await fetch(asset.src,{signal:AbortSignal.timeout(60000)});
            assert.equal(res.status,200,name);
            const bytes = Buffer.from(await res.arrayBuffer());
            assert.equal(sha(bytes),hashes[name]);
            const file = `${name}-accent.webp`;
            await writeFile(`${root}/${file}`,bytes);
            manifest[`${name}-accent`] = {origin:'Higgsfield generation',jobId:asset.jobId,variants:[{file,width:asset.width,height:asset.height,bytes:bytes.length,sha256:sha(bytes)}]};
          }
          await mkdir('docs',{recursive:true});
          await writeFile('docs/editorial-art-assets.json',JSON.stringify(manifest,null,2)+'\n');
          console.log(JSON.stringify(manifest,null,2));
          NODE
      - name: Commit assets to the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/illustrations/editorial docs/editorial-art-assets.json
          git diff --cached --quiet || git commit -m 'assets: store approved Italian artwork as optimized local WebP'
          git push origin HEAD:refs/heads/feat/subtle-italian-accents
      - name: Export exact source and installed framework guidance
        run: |
          git archive --format=tar.gz --output=/tmp/illustration-source.tar.gz HEAD
          cp node_modules/next/dist/docs/01-app/01-getting-started/11-css.md /tmp/next-css.md
          cp node_modules/next/dist/docs/01-app/01-getting-started/12-images.md /tmp/next-images.md
      - uses: actions/upload-artifact@v4
        with:
          name: illustration-source
          path: |
            /tmp/illustration-source.tar.gz
            /tmp/next-css.md
            /tmp/next-images.md
          retention-days: 3

<style>
@media (prefers-reduced-motion: no-preference) {
  .ribbon { animation: ribbon-flutter 2.4s ease-in-out infinite; transform-origin: 139px 28px; }
  @keyframes ribbon-flutter { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
  .idle-bob { animation: idle-bob 3.4s ease-in-out infinite; transform-origin: 118px 130px; }
  @keyframes idle-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .sparkle { animation: sparkle-pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes sparkle-pulse { 0%, 100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.05); } }
  .lamp { animation: lamp-blink 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes lamp-blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.12); } 97% { transform: scaleY(1); } }
}
</style>

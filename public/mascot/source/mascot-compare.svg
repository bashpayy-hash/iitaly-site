  .ribbon { animation: ribbon-flutter 2.4s ease-in-out infinite; transform-origin: 139px 28px; }
  @keyframes ribbon-flutter { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
  .lamp { animation: lamp-look 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes lamp-look { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-2.5px); } 65% { transform: translateX(2.5px); } }
}
</style>


